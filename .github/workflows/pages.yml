name: Publicar
# Pasa los tests, compila y publica la app en Firebase Hosting (https://escaner-nutricion.web.app).
# Los cambios propuestos (por ejemplo, de Dependabot) solo se prueban; se publica lo que llega a main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: la publicación usa la clave de la cuenta de servicio, no el token de GitHub.
permissions:
  contents: read

concurrency:
  group: publicar-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Solo se publica si existe la clave de la cuenta de servicio (secreto del repositorio).
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar en Firebase Hosting
        if: github.event_name != 'pull_request' && env.HAS_FIREBASE_KEY == 'true'
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/clave.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/clave.json" npx --yes firebase-tools@15.37.0 deploy --only hosting --project escaner-nutricion --non-interactive
          rm -f "$RUNNER_TEMP/clave.json"
